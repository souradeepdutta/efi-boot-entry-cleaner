name: Bug report
description: Something broke, or the app behaved in a way you did not expect.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** attach your BCD store or backup
        files. Never report a safety bypass publicly — see SECURITY.md instead.

  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the title bar and the footer.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version and build
      description: "Run `winver` and paste the version/build, e.g. Windows 11 23H2 (22631.4317)."
      placeholder: "Windows 11 24H2 (26100.1742)"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Which mode were you in?
      options:
        - Normal (live) mode
        - Dry-run mode
        - Demo mode (--demo)
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch as Administrator
        2. Click Refresh
        3. Select ...
        4. Click Remove Selected
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console or crash log
      description: "Copy the in-app console, or a file from `%LOCALAPPDATA%\\EFIBootCleaner\\logs`. Remove anything personal."
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am running the latest release.
          required: true
        - label: I did not attach my BCD store or backup files.
          required: true
