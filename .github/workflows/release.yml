name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.6"

      - name: Generate icon
        run: python tools/make_icon.py

      - name: Build one-file executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin `
            --name EFI-Boot-Entry-Cleaner `
            --icon assets/app.ico `
            --add-data "assets;assets" `
            --version-file packaging/windows_version_info.txt `
            --exclude-module tkinter `
            main.py

      - name: Write checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/EFI-Boot-Entry-Cleaner.exe" -Algorithm SHA256).Hash
          "SHA256  EFI-Boot-Entry-Cleaner.exe`n$hash" | Out-File -FilePath dist/SHA256.txt -Encoding ascii
          Get-Content dist/SHA256.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EFI-Boot-Entry-Cleaner.exe
            dist/SHA256.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
